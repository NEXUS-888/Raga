[pytest]
minversion = 8.0
addopts = -v --strict-markers
testpaths = tests
pythonpath = .
asyncio_mode = auto
markers =
    unit: Unit tests for isolated components
    integration: End-to-end API and service integration tests
    guardrails: Safety, topic classification, and hallucination verification tests
    latency: Latency profiling and P50/P70/P100 percentile tests
    stress: Concurrency, stress, and adversarial robustness tests
    multilingual: Indic (Hindi/Devanagari) and multilingual dataset tests
