services:
  # Unified Zero-CORS Voice RAG Service (Frontend + Backend on Singapore Edge)
  - type: web
    name: goa-voice-rag
    env: python
    region: singapore
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port 
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 20.0.0
      - key: PORT
        value: 10000
